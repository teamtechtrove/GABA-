<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GABA – Generative AI Brain Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <span class="brand-name">GABA</span>
          <span class="brand-sub">AI Brain</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item" id="btnNewChat" onclick="newChat()"><span class="nav-icon">✦</span> New Chat</button>
        <button class="nav-item" id="btnVoice" onclick="startVoiceInput()"><span class="nav-icon">🎙</span> Voice Input</button>
        <button class="nav-item" id="btnAuth" onclick="toggleAuthModal()"><span class="nav-icon">👤</span> Account</button>
      </nav>
      <div class="sidebar-section-label">Recent</div>
      <div class="sidebar-history" id="historyList"></div>
      <div class="sidebar-footer">
        <div class="creator-credit">Crafted by <a href="https://portfolioofarman.netlify.app" target="_blank">Arman</a></div>
        <div class="version-tag">v3.0</div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <div class="model-pill" id="modelPill"><span class="dot"></span><span id="modelLabel">Groq</span></div>
        <div class="topbar-actions">
          <button class="icon-btn" title="Clear chat" onclick="clearChat()">⊘</button>
          <button class="icon-btn voice-mobile" id="voiceBtnMobile" onclick="startVoiceInput()" title="Voice input">🎙</button>
        </div>
      </div>
      <button class="scroll-bottom-btn" id="scrollBottomBtn" onclick="scrollChat(true)" title="Jump to latest">↓</button>
      <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-inner">
            <div class="welcome-glyph">⚡</div>
            <h2 class="welcome-title">I'm GABA</h2>
            <p class="welcome-sub">Ask me anything — search the web, talk via voice, or just chat.</p>
            <div class="suggestion-grid">
              <button class="suggestion-card" onclick="useSuggestion('Search for latest AI news')"><span class="sug-icon">🌐</span><span>Latest AI news</span></button>
              <button class="suggestion-card" onclick="useSuggestion('Write a Python script to automate file backup')"><span class="sug-icon">⌨</span><span>Python backup script</span></button>
              <button class="suggestion-card" onclick="useSuggestion('Explain quantum computing in simple terms')"><span class="sug-icon">⚛</span><span>Quantum computing</span></button>
              <button class="suggestion-card" onclick="useSuggestion('Give me 5 business ideas for 2025')"><span class="sug-icon">💡</span><span>Business ideas</span></button>
            </div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>
      <div class="typing-indicator" id="typingIndicator"><div class="typing-dots"><span></span><span></span><span></span></div><span class="typing-text">GABA is thinking</span></div>
      <div class="input-bar">
        <div class="input-wrapper">
          <textarea id="userInput" placeholder="Message GABA…" rows="1" autofocus></textarea>
          <button id="sendBtn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <p class="input-hint"><span id="charCount">0</span>/4000 · Enter to send · Shift+Enter newline</p>
      </div>
    </main>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAuthModal()">&times;</span>
      <h2>Account</h2>
      <div id="authStatus">Loading...</div>
      <div id="authForm">
        <input type="email" id="authEmail" placeholder="Email" class="admin-input" style="margin-bottom:8px;">
        <input type="password" id="authPassword" placeholder="Password" class="admin-input" style="margin-bottom:8px;">
        <button class="admin-btn admin-btn-primary" id="authLoginBtn">Login</button>
        <button class="admin-btn admin-btn-ghost" id="authSignupBtn">Sign Up</button>
      </div>
      <div id="authLoggedIn" style="display:none;">
        <p>Logged in as <span id="userEmail"></span></p>
        <button class="admin-btn admin-btn-danger" id="authLogoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <!-- Hidden Admin Panel -->
  <div id="adminPanel" class="admin-panel">
    <div class="admin-header"><div class="admin-title"><span class="admin-icon">🔐</span><span>Admin Console</span></div><button class="admin-close" id="adminClose">✕</button></div>
    <div id="adminContent" class="admin-content"></div>
  </div>
  <div id="adminHotspot"></div>

  <script src="/static/script.js"></script>
</body>
</html>
